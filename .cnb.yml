main:
  web_trigger:
    - docker:
        image: node:22-bookworm-slim
      stages:
        - name: 从 GitHub Release 准备附件
          script: node scripts/prepare-cnb-release-assets.mjs
          exports:
            release_tag: CNB_RELEASE_TAG
        - name: 上传 CNB Release 附件
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_RELEASE_TAG
            attachments:
              - ./dist/cnb-release/*
