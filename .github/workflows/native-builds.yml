name: Native builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-builds.yml"
      - ".github/workflows/release.yml"
      - "scripts/verify-release-binary*"
      - "scripts/tauri-with-macos-helper.mjs"
      - "scripts/open-gitboost.command"
      - "src/**"
      - "src-tauri/**"
      - "package*.json"
      - "vite.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
            build: build:macos
            binary: bundle/macos/GitBoost.app/Contents/MacOS/GitBoost
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            build: build:windows
            binary: GitBoost.exe
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      APPLE_SIGNING_IDENTITY: "-"
      TAURI_ENV_PLATFORM: ${{ matrix.platform == 'windows-latest' && 'windows' || 'macos' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install project dependencies
        run: npm ci

      - name: Test scripts and frontend
        run: |
          npm run test:scripts
          npm test

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npm run ${{ matrix.build }} -- --ci

      - name: Verify release executable
        run: node scripts/verify-release-binary.mjs "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}" > native-report.json

      - name: Verify macOS app and DMG
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "src-tauri/target/${{ matrix.target }}/release/bundle/macos/GitBoost.app"
          hdiutil verify src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: GitBoost-${{ matrix.artifact }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            native-report.json
