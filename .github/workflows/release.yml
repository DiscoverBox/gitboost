name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            tauri_script: node scripts/tauri-with-macos-helper.mjs
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_script: npm run tauri

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs check-tag

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run release script tests
        run: npm run test:scripts

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: ${{ matrix.tauri_script }}
          tagName: ${{ github.ref_name }}
          releaseName: GitBoost ${{ github.ref_name }}
          releaseBody: |
            GitBoost ${{ github.ref_name }}

            - macOS: Apple Silicon DMG
            - Windows: NSIS EXE / MSI

            ## Code signing policy

            macOS installers are not signed with an Apple Developer ID certificate or notarized. Windows downloads must be treated as unsigned unless their Authenticode signature verifies successfully. Download GitBoost only from this project's GitHub Releases page.

            See the [Code signing policy](https://github.com/DiscoverBox/gitboost/blob/main/CODE_SIGNING_POLICY.md).
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
