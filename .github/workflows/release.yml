name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    env:
      BLA_WORK_DIR: ${{ github.workspace }}/.bla-experiment
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned BLA source
        uses: actions/checkout@v4
        with:
          repository: qybaihe/bla
          ref: b2d643600774d62e562081129e55b13b0d9e8a80
          path: .bla-tool
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs check-tag

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build BLA from its lockfile
        working-directory: .bla-tool
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/sync-version.mjs
          node node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Run frontend tests
        run: npm test

      - name: Run release script tests
        run: npm run test:scripts

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node scripts/bla-native.mjs
          tagName: ${{ github.ref_name }}
          releaseName: GitBoost ${{ github.ref_name }}
          releaseBody: |
            GitBoost ${{ github.ref_name }}

            - macOS: Apple Silicon DMG
            - Windows: NSIS EXE / MSI
            - BLA data is linked into native sections on both platforms and checked before upload. Resistance to reverse engineering has not been independently verified.

            ## Code signing policy

            macOS installers are not signed with an Apple Developer ID certificate or notarized. Windows downloads must be treated as unsigned unless their Authenticode signature verifies successfully. Download GitBoost only from this project's GitHub Releases page.

            See the [Code signing policy](https://github.com/DiscoverBox/gitboost/blob/main/CODE_SIGNING_POLICY.md).
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload BLA verification report
        uses: actions/upload-artifact@v4
        with:
          name: BLA-report-${{ matrix.target }}
          path: .bla-experiment/report.json
          include-hidden-files: true
          if-no-files-found: error
