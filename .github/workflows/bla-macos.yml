name: BLA builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bla-macos.yml"
      - "scripts/bla-native*"
      - "scripts/tauri-with-macos-helper.mjs"
      - "scripts/open-gitboost.command"
      - "src/**"
      - "src-tauri/**"
      - "package*.json"
      - "vite.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      BLA_WORK_DIR: ${{ github.workspace }}/.bla-experiment
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned BLA source
        uses: actions/checkout@v4
        with:
          repository: qybaihe/bla
          ref: b2d643600774d62e562081129e55b13b0d9e8a80
          path: .bla-tool
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install project dependencies
        run: npm ci

      - name: Build BLA from its lockfile
        working-directory: .bla-tool
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/sync-version.mjs
          node node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Test scripts and build frontend
        run: |
          npm run test:scripts
          npm test
          npm run build

      - name: Build and verify BLA installers
        run: node scripts/bla-native.mjs build --target ${{ matrix.target }}

      - name: Upload verified experimental build
        uses: actions/upload-artifact@v4
        with:
          name: GitBoost-bla-${{ matrix.artifact }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            .bla-experiment/GitBoost-bla-arm64.app.zip
            .bla-experiment/GitBoost-bla-x64.exe
            .bla-experiment/*.dmg
            .bla-experiment/*-setup.exe
            .bla-experiment/*.msi
            .bla-experiment/report.json
